import org.gradle.api.GradleException

plugins {
    id("java-library")
    id('maven-publish')
    id('net.neoforged.moddev') version '2.0.148'
    id("com.gradleup.shadow") version "9.4.0"
    id('idea')

    id("com.modrinth.minotaur") version "2.10.0" apply false
    id("net.darkhax.curseforgegradle") version "1.1.18" apply false
}

apply plugin: "java-library"
apply plugin: "com.gradleup.shadow"

String mod_version = "%s+%s".formatted(mod_base_version, mod_version_meta)

base.archivesName = archives_base_name
group = maven_group
version = mod_version

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    implementation "de.maxhenkel.configbuilder:configbuilder:${configbuilder_version}"
    shadow "de.maxhenkel.configbuilder:configbuilder:${configbuilder_version}"

    implementation "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

    runtimeOnly "maven.modrinth:simple-voice-chat:neoforge-${voicechat_mod_version}"

    implementation "javazoom:jlayer:${jlayer_version}"
    shadow "javazoom:jlayer:${jlayer_version}"
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
		minecraft_version      : minecraft_dependency,
		minecraft_version_range: minecraft_version_range,
		neo_version            : neo_version,
		voicechat_api_version  : voicechat_api_version,
		mod_id                 : mod_id,
		mod_name               : mod_title,
		mod_license            : 'All Rights Reserved',
		mod_version            : mod_version,
		mod_authors            : 'Max Henkel, CG360',
		mod_description        : 'Simple Voice Chat Radio'
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 25
}

java {
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { "${it}_${archivesBaseName}" }
    }
    manifest {
        attributes(['MixinConfigs': 'radio.mixins.json'])
    }
}

shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier = ''
    relocate 'de.maxhenkel.configbuilder', "de.maxhenkel.${mod_id}.configbuilder"
    relocate 'javazoom', "de.maxhenkel.${mod_id}.javazoom"
    mergeServiceFiles()
}

tasks.named('build').configure {
    dependsOn shadowJar
}

if (project.properties["skip-publishing-init"] == "false") {
    print("Defining publishing remotes")

    apply plugin: "com.modrinth.minotaur"
    apply from: "$rootDir/publishing.gradle"

    tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
        group = "upload"
        description = "Publishes project to CurseForge"

        String mcVer = project.properties["minecraft_dependency"]
        String projectVer = project.properties["mod_base_version"]
        String projectId = project.properties["curse_id"]

        if(projectVer == null || projectVer.isBlank())
            throw new IllegalStateException("Project version should not be null when publishing.")

        apiToken = getCurseToken(project)

        var shouldPublish = project.properties["debug_publishing"]
        if(shouldPublish != null && shouldPublish.toString().equalsIgnoreCase("true"))
            debugMode = true

        def mainFile = upload(projectId, shadowJar)
        mainFile.displayName = "[NEOFORGE][${mcVer}] ${mod_title} v${projectVer}"
        mainFile.addModLoader("NeoForge")
        mainFile.releaseType = project.properties["release_type"]
        mainFile.addGameVersion("Server")

        mainFile.changelogType = "markdown"
        mainFile.changelog = new File(project.getRootDir(), "changelog.md")

        for(String version: getSupportedVersions(project.properties))
            mainFile.addGameVersion(version)

        mainFile.addRequirement("simple-voice-chat")

    }

    tasks.modrinth.configure({
        group = 'upload'
    })
    tasks.modrinthSyncBody.configure({
        group = 'upload'
    })

    modrinth {
        String[] versions = getSupportedVersions(project.properties);

        token = getModrinthToken(project)
        projectId = modrinth_id
        versionName = "[NEOFORGE][${minecraft_dependency}] ${mod_title} v${mod_base_version}"
        versionNumber = "${mod_version}"
        versionType = release_type.toUpperCase()
        uploadFile = shadowJar
        gameVersions = Arrays.asList(versions)
        loaders = ['neoforge']

        syncBodyFrom = file('readme.md').text
        changelog = new File(project.getRootDir(), "changelog.md").readLines().join("\n")

        var shouldPublish = project.properties["debug_publishing"]
        if(shouldPublish != null && shouldPublish.toString().equalsIgnoreCase("true"))
            setDebugMode(true)

        dependencies {
            required.project '9eGKb6K1' // Simple Voice Chat
        }
    }
    tasks.modrinth.dependsOn(build)

} else {
    print("Publishing init disabled in gradle.properties.")

    tasks.register('curseforge') {
        group = 'upload'

        doLast {
            throw new GradleException("Publishing init has been disabled in gradle.properties so Curseforge publishing is not available.")
        }
    }

    tasks.register('modrinth') {
        group = 'upload'
        doLast {
            throw new GradleException('Publishing init has been disabled in gradle.properties so Modrinth publishing is not available.')
        }
    }

    tasks.register('modrinthSyncBody') {
        group = 'upload'
        doLast {
            throw new GradleException('Publishing init has been disabled in gradle.properties so Modrinth authoring is not available.')
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
