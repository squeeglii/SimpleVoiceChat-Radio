modLoader="javafml"
loaderVersion="${loader_version_range}"
license="All Rights Reserved"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_title}"
authors="Max Henkel, CG360"
description='''Simple Voice Chat Radio'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_dependency},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="voicechat_api"
    mandatory=true
    versionRange="[${voicechat_api_version},)"
    ordering="AFTER"
    side="BOTH"
