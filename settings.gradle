pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.maxhenkel.de/repository/public' }
    }
}

// common: platform independent code shared by all platforms (no Minecraft classes)
// fabric: the Fabric/Quilt mod
include 'common', 'fabric'
